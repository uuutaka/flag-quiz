<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6fb">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="暗記大会 国旗編">
<title>暗記大会｜国旗編</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e0ea;--accent:#2457d6;--accent2:#173d98;--soft:#edf3ff;--shadow:0 12px 32px rgba(23,32,51,.10);--radius:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}button,select{font:inherit}button{touch-action:manipulation}.app{max-width:760px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 2px 16px}h1{font-size:clamp(25px,6vw,34px);margin:0;line-height:1.15}.title-wrap{display:flex;flex-direction:column;gap:3px}.edition{font-size:13px;color:var(--muted);font-weight:750}.badge{font-size:12px;font-weight:800;background:var(--soft);color:var(--accent2);padding:8px 11px;border-radius:999px;white-space:nowrap}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.lead{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{min-width:0}label{display:block;font-size:12px;font-weight:800;color:#475467;margin:0 0 7px}select{width:100%;height:48px;border:1px solid #cfd7e4;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;padding:0 12px;outline:none}select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,214,.12)}.actions{display:flex;gap:10px;margin-top:17px}button{border:0;border-radius:13px;min-height:50px;padding:0 16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;flex:1}.primary:active{background:var(--accent2)}.secondary{background:#e9eef6;color:#344054}.small-note{font-size:12px;color:var(--muted);line-height:1.6;margin:13px 0 0}.hidden{display:none!important}.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:3px 2px 10px}.quiz-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;flex:1}.progress-label{font-size:13px;font-weight:850;color:#344054;text-align:right}.top-home-btn{background:#fff;border:1px solid var(--line);color:#475467;min-height:42px;padding:0 14px;white-space:nowrap;flex:0 0 auto}.progress-track{height:6px;background:#e2e7ef;border-radius:999px;overflow:hidden;margin-bottom:14px}.progress-bar{height:100%;background:var(--accent);width:0;transition:width .18s ease}.scene{perspective:1200px;min-height:min(58vh,520px);height:min(58vh,520px)}.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1);cursor:pointer;-webkit-tap-highlight-color:transparent}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px 20px;overflow:auto}.back{transform:rotateY(180deg);background:#fbfcff}.face-label{font-size:12px;font-weight:850;color:var(--accent2);background:var(--soft);padding:6px 10px;border-radius:999px;align-self:flex-start}.face-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 0;gap:12px}.question-prompt{font-size:18px;font-weight:800;text-align:center;color:#344054}.flag-img{display:block;width:min(72vw,360px);max-height:240px;aspect-ratio:4/3;object-fit:contain;border:1px solid #d0d5dd;background:#fff;user-select:none;-webkit-user-drag:none}.answer-flag-img{display:block;width:min(38vw,180px);max-height:130px;aspect-ratio:4/3;object-fit:contain;border:1px solid #d0d5dd;background:#fff;user-select:none;-webkit-user-drag:none}.answer{font-size:clamp(28px,7.2vw,40px);font-weight:900;line-height:1.45;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}.tap-hint{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}.nav{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:5;padding-top:12px;background:linear-gradient(to bottom,rgba(243,246,251,0),var(--bg) 30%)}.nav-row{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}.flip-btn{width:100%;margin-bottom:10px;background:#fff;border:1px solid #bfc9d8;color:var(--accent2)}.finish-panel h2{margin:0 0 8px;font-size:27px}.finish-panel p{margin:0;color:var(--muted);line-height:1.7}
@media(max-width:560px){.app{padding:12px 11px calc(22px + env(safe-area-inset-bottom))}.grid{grid-template-columns:1fr}.scene{height:58vh;min-height:390px;max-height:560px}.face{padding:18px 16px}.nav-row{grid-template-columns:1fr 1.45fr}.flag-img{width:min(78vw,340px)}}
@media(max-height:700px) and (max-width:560px){.scene{height:52vh;min-height:330px}.face-body{padding:8px 0}.flag-img{width:min(68vw,300px);max-height:190px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="title-wrap"><h1>暗記大会</h1><div class="edition">国旗編</div></div><div id="totalBadge" class="badge">読み込み中</div></header>
<section id="setup" class="panel">
<p class="lead">国旗を見て国名を思い浮かべ、カードをタップして答えを確認します。</p>
<div class="grid">
 <div class="field"><label for="order">出題順</label><select id="order"><option value="random" selected>ランダム</option><option value="sequential">順番</option></select></div>
 <div class="field"><label for="count">カード枚数</label><select id="count"><option value="5">5枚</option><option value="10">10枚</option><option value="20">20枚</option><option value="50">50枚</option><option value="100">100枚</option><option value="all" selected>全部</option></select></div>
</div>
<div class="actions"><button id="startBtn" class="primary" type="button" disabled>カードを開始</button></div>
<p id="dataStatus" class="small-note">国旗データを読み込んでいます。</p>
</section>
<section id="quiz" class="hidden">
 <div class="quiz-top"><button id="homeBtn" class="top-home-btn" type="button">← ホーム</button><div class="quiz-meta"><div id="progressLabel" class="progress-label"></div></div></div>
 <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
 <div class="scene" aria-live="polite">
  <div id="card" class="card" role="button" tabindex="0" aria-label="国旗カード。タップで答えを表示">
   <div class="face front"><div class="face-label">問題</div><div class="face-body"><div class="question-prompt">この国旗はどこの国？</div><img id="flagImage" class="flag-img" alt="問題の国旗"></div><div class="tap-hint">タップして答えを見る</div></div>
   <div class="face back"><div class="face-label">答え</div><div class="face-body"><img id="answerFlagImage" class="answer-flag-img" alt="正解の国旗"><div id="answerText" class="answer"></div></div><div class="tap-hint">タップして問題に戻る</div></div>
  </div>
 </div>
 <div class="nav"><button id="flipBtn" class="flip-btn" type="button">答えを見る</button><div class="nav-row"><button id="prevBtn" class="secondary" type="button">前へ</button><button id="nextBtn" class="primary" type="button">次へ</button></div></div>
</section>
<section id="finish" class="panel finish-panel hidden"><h2>終了</h2><p id="finishText"></p><div class="actions"><button id="againBtn" class="secondary" type="button">もう一度</button><button id="settingsBtn" class="primary" type="button">ホームへ</button></div></section>
</div>
<script>
let DATA=[];
const $=id=>document.getElementById(id);
const el={setup:$('setup'),quiz:$('quiz'),finish:$('finish'),order:$('order'),count:$('count'),start:$('startBtn'),card:$('card'),flag:$('flagImage'),answerFlag:$('answerFlagImage'),answer:$('answerText'),progress:$('progressLabel'),bar:$('progressBar'),flip:$('flipBtn'),prev:$('prevBtn'),next:$('nextBtn'),home:$('homeBtn'),again:$('againBtn'),settings:$('settingsBtn'),finishText:$('finishText'),badge:$('totalBadge'),status:$('dataStatus')};
let session=null;
async function loadData(){try{const res=await fetch('./countries.json',{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const payload=await res.json();DATA=payload.countries||[];if(!DATA.length)throw new Error('データが空です');el.badge.textContent=`全 ${DATA.length} か国`;el.status.textContent=`国旗データを読み込みました（${DATA.length}か国）`;el.start.disabled=false}catch(err){console.error(err);el.badge.textContent='読込エラー';el.status.textContent='countries.json を読み込めませんでした。公開URLから開いているか確認してください。'}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selected(){let a=DATA.slice();if(el.order.value==='random')a=shuffle(a);const n=el.count.value==='all'?a.length:Math.min(+el.count.value,a.length);return a.slice(0,n)}
function start(){const cards=selected();if(!cards.length)return;session={cards,index:0};el.setup.classList.add('hidden');el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollTop()}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function flipped(){return el.card.classList.contains('flipped')}
function setFlip(v){el.card.classList.toggle('flipped',v);el.flip.textContent=v?'問題に戻る':'答えを見る';el.card.setAttribute('aria-label',v?'答え。タップで問題に戻る':'国旗カード。タップで答えを表示')}
function toggleFlip(){setFlip(!flipped())}
function flagUrl(x){return `https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.5.0/flags/4x3/${String(x.code).toLowerCase()}.svg`}
function render(){const x=session.cards[session.index],i=session.index,n=session.cards.length;setFlip(false);const src=flagUrl(x);el.flag.src=src;el.flag.alt=`${x.name}の国旗（問題）`;el.answerFlag.src=src;el.answerFlag.alt=`${x.name}の国旗`;el.answer.textContent=x.name;el.progress.textContent=`${i+1} / ${n} 枚`;el.bar.style.width=`${(i+1)/n*100}%`;el.prev.disabled=i===0;el.next.textContent=i===n-1?'終了':'次へ'}
function prev(){if(session.index>0){session.index--;render();scrollTop()}}
function next(){if(session.index<session.cards.length-1){session.index++;render();scrollTop()}else finish()}
function home(){session=null;setFlip(false);el.quiz.classList.add('hidden');el.finish.classList.add('hidden');el.setup.classList.remove('hidden');scrollTop()}
function finish(){el.quiz.classList.add('hidden');el.finish.classList.remove('hidden');el.finishText.textContent=`${session.cards.length}枚の国旗カードを確認しました。`;scrollTop()}
function again(){start()}
function settings(){home()}
el.start.addEventListener('click',start);el.card.addEventListener('click',toggleFlip);el.flip.addEventListener('click',toggleFlip);el.prev.addEventListener('click',prev);el.next.addEventListener('click',next);el.home.addEventListener('click',home);el.again.addEventListener('click',again);el.settings.addEventListener('click',settings);el.card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFlip()}});loadData();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script>
</body></html>
